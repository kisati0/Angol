<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Szómondó — magyar-angol beszédfordító</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF6EE;
    --ink: #26221D;
    --ink-soft: #6b6459;
    --paprika: #C1440E;
    --paprika-deep: #9c3608;
    --teal: #1F4C46;
    --gold: #D9A441;
    --card: #FFFFFF;
    --line: #E8DFCF;
    --radius: 18px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app{
    width: 100%;
    max-width: 460px;
    padding: 22px 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  header{
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px 4px 6px;
  }
  header .eyebrow{
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--paprika);
    font-weight: 600;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    margin: 2px 0 0;
    line-height: 1.15;
  }
  .stitch{
    height: 8px;
    width: 100%;
    background-image: repeating-linear-gradient(90deg, var(--paprika) 0 6px, transparent 6px 12px),
                       repeating-linear-gradient(90deg, transparent 0 3px, var(--gold) 3px 9px, transparent 9px 12px);
    background-size: 12px 3px, 12px 3px;
    background-position: 0 0, 0 5px;
    background-repeat: repeat-x;
    opacity: 0.9;
    border-radius: 4px;
  }

  .mic-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 26px 0 8px;
  }
  #micBtn{
    width: 108px;
    height: 108px;
    border-radius: 50%;
    border: none;
    background: var(--paprika);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(193,68,14,0.28);
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    position: relative;
  }
  #micBtn:active{ transform: scale(0.96); }
  #micBtn.listening{
    background: var(--teal);
    box-shadow: 0 0 0 0 rgba(31,76,70,0.5);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(31,76,70,0.45); }
    70%{ box-shadow: 0 0 0 22px rgba(31,76,70,0); }
    100%{ box-shadow: 0 0 0 0 rgba(31,76,70,0); }
  }
  #micBtn svg{ width: 40px; height: 40px; }
  .mic-status{
    font-size: 14px;
    color: var(--ink-soft);
    min-height: 18px;
    text-align: center;
  }

  .fallback-row{
    display: flex;
    gap: 8px;
  }
  .fallback-row input{
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    background: var(--card);
    color: var(--ink);
  }
  .fallback-row button{
    padding: 0 16px;
    border-radius: 12px;
    border: none;
    background: var(--teal);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .result-card{
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    border: 1px solid var(--line);
    display: none;
    flex-direction: column;
    gap: 10px;
    position: relative;
  }
  .result-card.show{ display: flex; }
  .result-card::before{
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 13px;
    border: 2px dashed rgba(193,68,14,0.25);
    pointer-events: none;
  }
  .lang-row{ display:flex; align-items:baseline; gap: 8px; }
  .lang-tag{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .lang-tag.hu{ background: rgba(217,164,65,0.2); color: var(--paprika-deep); }
  .lang-tag.en{ background: rgba(31,76,70,0.12); color: var(--teal); }
  .orig-text{ font-size: 15px; color: var(--ink-soft); }
  .trans-text{
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.25;
  }
  .source-note{
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background: var(--gold); display:inline-block; }
  .card-actions{
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .icon-btn{
    border: none;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    display:flex; align-items:center; gap:6px;
  }
  .icon-btn:hover{ background: #f2ece0; }

  section.history{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .history-head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 2px;
  }
  .history-head h2{
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  .history-head span{
    font-size: 12px;
    color: var(--ink-soft);
  }
  .history-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .hist-item{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .hist-item:hover{ border-color: var(--paprika); }
  .hist-main{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .hist-hu{ font-size: 13px; color: var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-en{ font-size: 15px; font-weight: 600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-src{ flex-shrink:0; }
  .empty-state{
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    padding: 18px 10px;
    border: 1px dashed var(--line);
    border-radius: 12px;
  }
  .clear-link{
    font-size: 12px;
    color: var(--paprika);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }
  footer{
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    padding-top: 4px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Szómondó · HU → EN</div>
    <h1>Mondd ki magyarul,<br>meghallod angolul.</h1>
  </header>
  <div class="stitch"></div>

  <div class="mic-wrap">
    <button id="micBtn" aria-label="Felvétel indítása">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <div class="mic-status" id="micStatus">Koppints és mondd ki a szót vagy mondatot</div>
  </div>

  <div class="fallback-row" id="fallbackRow" style="display:none;">
    <input type="text" id="textInput" placeholder="Írd be magyarul, ha a mikrofon nem elérhető">
    <button id="textGo">Fordít</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="lang-row"><span class="lang-tag hu">HU</span></div>
    <div class="orig-text" id="origText"></div>
    <div class="lang-row"><span class="lang-tag en">EN</span></div>
    <div class="trans-text" id="transText"></div>
    <div class="source-note" id="sourceNote"><span class="dot"></span><span></span></div>
    <div class="card-actions">
      <button class="icon-btn" id="speakBtn">🔊 Kimondja</button>
      <button class="icon-btn" id="saveBtn" style="display:none;">＋ Mentés a szótáramba</button>
    </div>
  </div>

  <section class="history">
    <div class="history-head">
      <h2>Saját szótáram</h2>
      <span id="dictCount">0 szó</span>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-state">Még nincs elmentett szavad — ami újat kimondasz és lefordítunk, azt itt tudod menteni.</div>
    </div>
    <button class="clear-link" id="clearBtn" style="display:none; align-self:flex-start;">Szótár törlése</button>
  </section>

  <footer>Saját szótár + AI fordítás · offline az elmentett szavaknál</footer>
</div>

<script>
(function(){
  const micBtn = document.getElementById('micBtn');
  const micStatus = document.getElementById('micStatus');
  const fallbackRow = document.getElementById('fallbackRow');
  const textInput = document.getElementById('textInput');
  const textGo = document.getElementById('textGo');
  const resultCard = document.getElementById('resultCard');
  const origText = document.getElementById('origText');
  const transText = document.getElementById('transText');
  const sourceNote = document.getElementById('sourceNote');
  const speakBtn = document.getElementById('speakBtn');
  const saveBtn = document.getElementById('saveBtn');
  const historyList = document.getElementById('historyList');
  const dictCount = document.getElementById('dictCount');
  const clearBtn = document.getElementById('clearBtn');

  let dictionary = {}; // hu (lowercased) -> {hu, en, addedManually}
  let pendingEntry = null;
  const STORAGE_KEY = 'hu-en-dictionary';

  function norm(s){
    return s.trim().toLowerCase().replace(/[.,!?;:]+$/,'');
  }

  async function loadDictionary(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        dictionary = JSON.parse(res.value);
      }
    }catch(e){
      dictionary = {};
    }
    renderHistory();
  }

  async function saveDictionary(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(dictionary), false);
    }catch(e){
      console.error('Mentési hiba', e);
    }
  }

  function renderHistory(){
    const entries = Object.values(dictionary).sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
    dictCount.textContent = entries.length + (entries.length === 1 ? ' szó' : ' szó');
    clearBtn.style.display = entries.length ? 'inline-block' : 'none';
    if(!entries.length){
      historyList.innerHTML = '<div class="empty-state">Még nincs elmentett szavad — ami újat kimondasz és lefordítunk, azt itt tudod menteni.</div>';
      return;
    }
    historyList.innerHTML = '';
    entries.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'hist-item';
      row.innerHTML = `
        <div class="hist-main">
          <div class="hist-hu">${escapeHtml(entry.hu)}</div>
          <div class="hist-en">${escapeHtml(entry.en)}</div>
        </div>
        <div class="hist-src">🔊</div>
      `;
      row.addEventListener('click', () => {
        showResult(entry.hu, entry.en, 'dictionary');
      });
      historyList.appendChild(row);
    });
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function showResult(hu, en, source){
    origText.textContent = hu;
    transText.textContent = en;
    resultCard.classList.add('show');
    if(source === 'dictionary'){
      sourceNote.querySelector('span:last-child').textContent = 'A saját szótáradból';
      saveBtn.style.display = 'none';
      pendingEntry = null;
    } else {
      sourceNote.querySelector('span:last-child').textContent = 'AI fordítás — mentsd el, hogy legközelebb gyorsabb legyen';
      saveBtn.style.display = 'inline-flex';
      pendingEntry = { hu, en };
    }
    speak(en);
  }

  function speak(text){
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  speakBtn.addEventListener('click', () => {
    if(transText.textContent) speak(transText.textContent);
  });

  saveBtn.addEventListener('click', async () => {
    if(!pendingEntry) return;
    const key = norm(pendingEntry.hu);
    dictionary[key] = { hu: pendingEntry.hu, en: pendingEntry.en, updatedAt: Date.now() };
    await saveDictionary();
    renderHistory();
    saveBtn.style.display = 'none';
    sourceNote.querySelector('span:last-child').textContent = 'Elmentve a szótáradba';
  });

  clearBtn.addEventListener('click', async () => {
    if(!confirm('Biztosan törlöd a teljes szótáradat?')) return;
    dictionary = {};
    await saveDictionary();
    renderHistory();
  });

  async function translateWithAI(hu){
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [
          { role: "user", content:
            `You are a Hungarian-to-English translation engine for a language-learning app. Translate the following Hungarian word or sentence into natural, everyday English. Respond ONLY with the English translation, nothing else — no quotes, no explanation, no preamble.\n\nHungarian: ${hu}` }
        ]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error('Nincs válasz');
    return textBlock.text.trim();
  }

  async function handleUtterance(hu){
    hu = hu.trim();
    if(!hu) return;
    const key = norm(hu);
    if(dictionary[key]){
      showResult(hu, dictionary[key].en, 'dictionary');
      micStatus.textContent = 'Koppints és mondd ki a szót vagy mondatot';
      return;
    }
    micStatus.textContent = 'Fordítás AI-val…';
    try{
      const en = await translateWithAI(hu);
      showResult(hu, en, 'ai');
    }catch(e){
      micStatus.textContent = 'Hiba történt a fordítás közben. Próbáld újra.';
      return;
    }
    micStatus.textContent = 'Koppints és mondd ki a szót vagy mondatot';
  }

  // Speech recognition setup
  let recognition = null;
  let listening = false;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(SR){
    recognition = new SR();
    recognition.lang = 'hu-HU';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('listening');
      micStatus.textContent = 'Hallgatlak…';
    };
    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
    };
    recognition.onerror = (e) => {
      listening = false;
      micBtn.classList.remove('listening');
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        micStatus.textContent = 'Nincs mikrofon-hozzáférés — használd a szöveges mezőt lent.';
        fallbackRow.style.display = 'flex';
      } else {
        micStatus.textContent = 'Nem sikerült felismerni — próbáld újra.';
      }
    };
    recognition.onresult = (e) => {
      const said = e.results[0][0].transcript;
      handleUtterance(said);
    };

    micBtn.addEventListener('click', () => {
      if(listening){
        recognition.stop();
        return;
      }
      try{
        recognition.start();
      }catch(e){
        micStatus.textContent = 'Nem sikerült elindítani a mikrofont.';
        fallbackRow.style.display = 'flex';
      }
    });
  } else {
    micStatus.textContent = 'A telefonod böngészője nem támogatja a hangfelismerést itt — használd a szöveges mezőt.';
    fallbackRow.style.display = 'flex';
    micBtn.style.opacity = '0.4';
    micBtn.style.cursor = 'not-allowed';
  }

  textGo.addEventListener('click', () => {
    const v = textInput.value;
    if(v.trim()) handleUtterance(v);
    textInput.value = '';
  });
  textInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ textGo.click(); }
  });

  loadDictionary();
})();
</script>
</body>
</html>
