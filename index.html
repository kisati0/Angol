<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Szómondó — magyar-angol beszédfordító</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF6EE;
    --ink: #26221D;
    --ink-soft: #6b6459;
    --paprika: #C1440E;
    --paprika-deep: #9c3608;
    --teal: #1F4C46;
    --gold: #D9A441;
    --card: #FFFFFF;
    --line: #E8DFCF;
    --radius: 18px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app{
    width: 100%;
    max-width: 460px;
    padding: 30px 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .mic-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px 0 6px;
  }
  #micBtn{
    width: 108px;
    height: 108px;
    border-radius: 50%;
    border: none;
    background: var(--paprika);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(193,68,14,0.28);
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  #micBtn:active{ transform: scale(0.96); }
  #micBtn.listening{
    background: var(--teal);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(31,76,70,0.45); }
    70%{ box-shadow: 0 0 0 22px rgba(31,76,70,0); }
    100%{ box-shadow: 0 0 0 0 rgba(31,76,70,0); }
  }
  #micBtn svg{ width: 40px; height: 40px; }
  .error-status{
    font-size: 13px;
    color: var(--paprika-deep);
    text-align: center;
    display: none;
  }
  .error-status.show{ display: block; }

  .fallback-row{
    display: flex;
    gap: 8px;
  }
  .fallback-row input{
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    background: var(--card);
    color: var(--ink);
  }
  .fallback-row button{
    padding: 0 16px;
    border-radius: 12px;
    border: none;
    background: var(--teal);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .result-card{
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    border: 1px solid var(--line);
    display: none;
    flex-direction: column;
    gap: 10px;
    position: relative;
  }
  .result-card.show{ display: flex; }
  .result-card::before{
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 13px;
    border: 2px dashed rgba(193,68,14,0.22);
    pointer-events: none;
  }
  .lang-tag{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    display: inline-block;
  }
  .lang-tag.hu{ background: rgba(217,164,65,0.2); color: var(--paprika-deep); }
  .lang-tag.en{ background: rgba(31,76,70,0.12); color: var(--teal); }
  .orig-text{ font-size: 15px; color: var(--ink-soft); }
  .trans-text{
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.25;
  }
  .card-actions{
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .icon-btn{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    display:flex; align-items:center; gap:6px;
  }
  .icon-btn:hover{ background: #f2ece0; }
  .icon-btn:disabled{ opacity: 0.45; cursor: default; }

  section.history{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .history-head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 2px;
  }
  .history-head h2{
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  .history-head span{
    font-size: 12px;
    color: var(--ink-soft);
  }
  .play-row{
    display: flex;
    gap: 8px;
  }
  .play-row .icon-btn{ flex: 1; justify-content: center; }
  .history-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 340px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .hist-item{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .hist-item:hover{ border-color: var(--paprika); }
  .hist-main{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .hist-hu{ font-size: 13px; color: var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-en{ font-size: 15px; font-weight: 600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-del{
    flex-shrink:0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--bg);
    color: var(--paprika-deep);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .hist-del:hover{ background: rgba(193,68,14,0.15); }
  .empty-state{
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    padding: 18px 10px;
    border: 1px dashed var(--line);
    border-radius: 12px;
  }
</style>
</head>
<body>
<div class="app">

  <div class="mic-wrap">
    <button id="micBtn" aria-label="Felvétel indítása">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <div class="error-status" id="errorStatus"></div>
  </div>

  <div class="fallback-row" id="fallbackRow" style="display:none;">
    <input type="text" id="textInput" placeholder="Írj be egy szót magyarul vagy angolul">
    <button id="textGo">Fordít</button>
  </div>

  <div class="result-card" id="resultCard">
    <span class="lang-tag" id="tag1"></span>
    <div class="orig-text" id="origText"></div>
    <span class="lang-tag" id="tag2"></span>
    <div class="trans-text" id="transText"></div>
    <div class="card-actions">
      <button class="icon-btn" id="speakBtn">🔊</button>
      <button class="icon-btn" id="saveBtn" style="display:none;">＋ Mentés</button>
    </div>
  </div>

  <section class="history">
    <div class="history-head">
      <h2>Szótár</h2>
      <span id="dictCount">0 szó</span>
    </div>
    <div class="play-row">
      <button class="icon-btn" id="playEnBtn">▶ Angol</button>
      <button class="icon-btn" id="playAllBtn">▶ Angol + Magyar</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-state">Még nincs elmentett szavad.</div>
    </div>
  </section>

</div>

<script>
(function(){
  const micBtn = document.getElementById('micBtn');
  const errorStatus = document.getElementById('errorStatus');
  const fallbackRow = document.getElementById('fallbackRow');
  const textInput = document.getElementById('textInput');
  const textGo = document.getElementById('textGo');
  const resultCard = document.getElementById('resultCard');
  const origText = document.getElementById('origText');
  const transText = document.getElementById('transText');
  const tag1 = document.getElementById('tag1');
  const tag2 = document.getElementById('tag2');
  const speakBtn = document.getElementById('speakBtn');
  const saveBtn = document.getElementById('saveBtn');
  const historyList = document.getElementById('historyList');
  const dictCount = document.getElementById('dictCount');
  const playEnBtn = document.getElementById('playEnBtn');
  const playAllBtn = document.getElementById('playAllBtn');

  const STORAGE_KEY = 'hu-en-dictionary-v2';
  let dictionary = {};
  let pendingEntry = null;
  let lastTarget = null; // {text, lang} for the replay button
  let playingMode = null;
  let stopPlayback = false;

  function norm(s){
    return s.trim().toLowerCase().replace(/[.,!?;:]+$/,'');
  }

  function loadDictionary(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) dictionary = JSON.parse(raw);
    }catch(e){ dictionary = {}; }
    renderHistory();
  }

  function saveDictionaryToDisk(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(dictionary)); }catch(e){}
  }

  function findEntry(text){
    const n = norm(text);
    return Object.values(dictionary).find(e => norm(e.hu) === n || norm(e.en) === n);
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function sortedEntries(){
    return Object.entries(dictionary).sort((a,b) => (b[1].updatedAt||0) - (a[1].updatedAt||0));
  }

  function renderHistory(){
    const entries = sortedEntries();
    dictCount.textContent = entries.length + ' szó';
    if(!entries.length){
      historyList.innerHTML = '<div class="empty-state">Még nincs elmentett szavad.</div>';
      return;
    }
    historyList.innerHTML = '';
    entries.forEach(([key, entry]) => {
      const row = document.createElement('div');
      row.className = 'hist-item';
      row.innerHTML = `
        <div class="hist-main">
          <div class="hist-hu">${escapeHtml(entry.hu)}</div>
          <div class="hist-en">${escapeHtml(entry.en)}</div>
        </div>
        <button class="hist-del" data-key="${escapeHtml(key)}" aria-label="Törlés">✕</button>
      `;
      row.querySelector('.hist-main').addEventListener('click', () => {
        showResult(entry.hu, entry.en, 'hu', true);
      });
      row.querySelector('.hist-del').addEventListener('click', (ev) => {
        ev.stopPropagation();
        delete dictionary[key];
        saveDictionaryToDisk();
        renderHistory();
      });
      historyList.appendChild(row);
    });
  }

  function showResult(hu, en, sourceLang, fromDictionary){
    resultCard.classList.add('show');
    if(sourceLang === 'hu'){
      tag1.className = 'lang-tag hu'; tag1.textContent = 'HU';
      tag2.className = 'lang-tag en'; tag2.textContent = 'EN';
      origText.textContent = hu;
      transText.textContent = en;
      lastTarget = { text: en, lang: 'en-US' };
    } else {
      tag1.className = 'lang-tag en'; tag1.textContent = 'EN';
      tag2.className = 'lang-tag hu'; tag2.textContent = 'HU';
      origText.textContent = en;
      transText.textContent = hu;
      lastTarget = { text: hu, lang: 'hu-HU' };
    }
    saveBtn.style.display = fromDictionary ? 'none' : 'inline-flex';
    pendingEntry = fromDictionary ? null : { hu, en };
    speak(lastTarget.text, lastTarget.lang);
  }

  function speak(text, lang){
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function speakAsync(text, lang){
    return new Promise((resolve) => {
      try{
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        u.rate = 0.95;
        u.onend = resolve;
        u.onerror = resolve;
        window.speechSynthesis.speak(u);
      }catch(e){ resolve(); }
    });
  }

  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

  speakBtn.addEventListener('click', () => {
    if(lastTarget) speak(lastTarget.text, lastTarget.lang);
  });

  saveBtn.addEventListener('click', () => {
    if(!pendingEntry) return;
    const key = norm(pendingEntry.hu);
    dictionary[key] = { hu: pendingEntry.hu, en: pendingEntry.en, updatedAt: Date.now() };
    saveDictionaryToDisk();
    renderHistory();
    saveBtn.style.display = 'none';
  });

  async function runPlayback(mode){
    if(playingMode === mode){
      stopPlayback = true;
      return;
    }
    stopPlayback = true;
    await wait(50);
    stopPlayback = false;
    playingMode = mode;
    playEnBtn.textContent = mode === 'en' ? '■ Leállítás' : '▶ Angol';
    playAllBtn.textContent = mode === 'en-hu' ? '■ Leállítás' : '▶ Angol + Magyar';
    const entries = sortedEntries().map(e => e[1]);
    for(const entry of entries){
      if(stopPlayback) break;
      await speakAsync(entry.en, 'en-US');
      if(stopPlayback) break;
      if(mode === 'en-hu'){
        await wait(250);
        await speakAsync(entry.hu, 'hu-HU');
        if(stopPlayback) break;
      }
      await wait(350);
    }
    playingMode = null;
    playEnBtn.textContent = '▶ Angol';
    playAllBtn.textContent = '▶ Angol + Magyar';
  }

  playEnBtn.addEventListener('click', () => runPlayback('en'));
  playAllBtn.addEventListener('click', () => runPlayback('en-hu'));

  // --- language detection (heuristic) ---
  const HU_WORDS = new Set(['a','az','és','vagy','de','hogy','nem','igen','én','te','ő','mi','ti','ők','ez','egy','van','vagyok','volt','lesz','kell','lehet','jó','rossz','nagy','kicsi','szeretlek','szia','köszönöm','kérem','hol','mikor','miért','hogyan','mennyi','ki','kicsoda','szia','jó reggelt','szeretem','nagyon','is','csak','még','már','itt','ott']);
  const EN_WORDS = new Set(['the','a','an','and','or','but','that','not','yes','no','i','you','he','she','we','they','it','this','is','are','was','were','will','can','could','good','bad','big','small','love','hello','thanks','please','where','when','why','how','much','who','what','very','just','still','here','there']);

  function detectLanguage(text){
    if(/[áéíóöőúüű]/i.test(text)) return 'hu';
    const words = text.toLowerCase().split(/\s+/).map(w => w.replace(/[^a-z]/gi,''));
    let huScore = 0, enScore = 0;
    words.forEach(w => {
      if(HU_WORDS.has(w)) huScore++;
      if(EN_WORDS.has(w)) enScore++;
    });
    return enScore > huScore ? 'en' : 'hu';
  }

  async function translate(text, langpair){
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + langpair;
    const response = await fetch(url);
    const data = await response.json();
    const translated = data && data.responseData && data.responseData.translatedText;
    if(!translated) throw new Error('no result');
    return translated.trim();
  }

  function showError(msg){
    errorStatus.textContent = msg;
    errorStatus.classList.add('show');
  }
  function clearError(){
    errorStatus.classList.remove('show');
  }

  async function handleUtterance(said){
    said = said.trim();
    if(!said) return;
    clearError();
    const existing = findEntry(said);
    if(existing){
      const lang = detectLanguage(said);
      showResult(existing.hu, existing.en, lang, true);
      return;
    }
    const lang = detectLanguage(said);
    try{
      if(lang === 'hu'){
        const en = await translate(said, 'hu|en');
        showResult(said, en, 'hu', false);
      } else {
        const hu = await translate(said, 'en|hu');
        showResult(hu, said, 'en', false);
      }
    }catch(e){
      showError('Hiba történt a fordítás közben.');
    }
  }

  // Speech recognition setup
  let recognition = null;
  let listening = false;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(SR){
    recognition = new SR();
    recognition.lang = 'hu-HU';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('listening');
      clearError();
    };
    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
    };
    recognition.onerror = (e) => {
      listening = false;
      micBtn.classList.remove('listening');
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        showError('Nincs mikrofon-hozzáférés — használd a szöveges mezőt lent.');
        fallbackRow.style.display = 'flex';
      } else if(e.error !== 'no-speech' && e.error !== 'aborted'){
        showError('Nem sikerült felismerni — próbáld újra.');
      }
    };
    recognition.onresult = (e) => {
      const said = e.results[0][0].transcript;
      handleUtterance(said);
    };

    micBtn.addEventListener('click', () => {
      if(listening){ recognition.stop(); return; }
      try{ recognition.start(); }
      catch(e){
        showError('Nem sikerült elindítani a mikrofont.');
        fallbackRow.style.display = 'flex';
      }
    });
  } else {
    showError('A böngésződ nem támogatja a hangfelismerést — használd a szöveges mezőt.');
    fallbackRow.style.display = 'flex';
    micBtn.style.opacity = '0.4';
    micBtn.style.cursor = 'not-allowed';
  }

  textGo.addEventListener('click', () => {
    const v = textInput.value;
    if(v.trim()) handleUtterance(v);
    textInput.value = '';
  });
  textInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ textGo.click(); }
  });

  loadDictionary();
})();
</script>
</body>
</html>
